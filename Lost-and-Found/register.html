<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Create account | Lost & Found+</title><link rel="stylesheet" href="style.css"><script src="script.js"></script></head>
<body class="auth-page"><a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">+</span><span>Lost & Found<span class="brand-plus">+</span></span></a><nav><a href="login.html" class="text-link">Log in →</a></nav></div></header>
<main id="main-content" tabindex="-1" class="auth-main"><p class="local-notice">Local demo: reports and claims stay in this browser. They are not shared with other devices.</p><div class="auth-card"><div class="auth-icon">+</div><span class="eyebrow">GET STARTED</span><h1>Create your account</h1><p class="muted">Join your community and help reunite belongings.</p><form id="registerForm" novalidate><label>Full name<input id="registerName" autocomplete="name" required maxlength="60" placeholder="Your name"></label><label>Email<input id="registerEmail" autocomplete="email" type="email" required maxlength="254" placeholder="you@example.com"></label><label>Password<input id="registerPassword" autocomplete="new-password" type="password" minlength="6" required placeholder="At least 6 characters"></label><div id="registerError" class="form-message error" role="alert"></div><button class="btn btn-primary full">Create account →</button></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></main><script src="auth.js"></script></body></html>
