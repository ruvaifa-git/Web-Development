<body class="auth-page"><a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><div class="container nav"><a class="brand" href="index.html"><span class="brand-mark">+</span><span>Lost & Found<span class="brand-plus">+</span></span></a><nav><a href="register.html" class="text-link">Create account →</a></nav></div></header>
